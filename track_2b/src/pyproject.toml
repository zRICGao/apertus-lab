[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apertus-lab"
version = "0.2.0"
description = "Bounded Apertus experiment MVP with evidence and independent replay"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
apertus-lab = "apertus_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apertus_lab*"]

[tool.setuptools.package-data]
apertus_lab = ["*.json"]
"apertus_lab.platform" = ["*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
